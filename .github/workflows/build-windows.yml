name: Build Cross-Platform Installers (Windows & Mac)

on:
  push:
    branches: [ main ] # 💡 만약 사용 중이신 브랜치 이름이 master라면 master로 변경하세요.

jobs:
  # -----------------------------------------------------------------
  # 1. 윈도우용 .exe 빌드 환경
  # -----------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Pack App (Windows)
        run: |
          .\mvnw clean package -DskipTests

      - name: Copy Dependencies (Windows)
        run: |
          .\mvnw dependency:copy-dependencies -DoutputDirectory=target/libs

      - name: Build Standalone Windows EXE Installer
        run: |
          copy target\demo1-1.0-SNAPSHOT.jar target\libs\
          jpackage --type exe --name "TheProject" --input target/libs --main-jar demo1-1.0-SNAPSHOT.jar --main-class part.demo1.HelloApplication --win-dir-chooser --win-shortcut

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-Installer
          path: ./*.exe

  # -----------------------------------------------------------------
  # 2. 맥용 .dmg 빌드 환경 (M1/M2/M3 및 인텔 맥 모두 가동 가능)
  # -----------------------------------------------------------------
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Pack App (Mac)
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Copy Dependencies (Mac)
        run: |
          ./mvnw dependency:copy-dependencies -DoutputDirectory=target/libs

      - name: Build Standalone Mac DMG Installer
        run: |
          cp target/demo1-1.0-SNAPSHOT.jar target/libs/
          jpackage --type dmg --name "TheProject" --input target/libs --main-jar demo1-1.0-SNAPSHOT.jar --main-class part.demo1.HelloApplication

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Mac-Installer
          path: ./*.dmg
